/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

repositories {
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
    // paymenthub-ee-bom and paymenthub-ee-core 2.0.0-SNAPSHOT live on the
    // official Mifos JFrog. The old fyn-libs-snapshot repo is gone: it only
    // served ph-ee-connector-common 1.x.
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local')
    }
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/mifosx-gradle-local')
    }
}

dependencies {
    // Mifos Platform BOM pins Spring Boot 3.4, Camel 4, Zeebe 8, Jakarta EE 10
    // and every other shared library version. Do NOT hardcode managed versions.
    // This is a deployable application (leaf node), so use enforcedPlatform().
    implementation enforcedPlatform('org.mifos:paymenthub-ee-bom:2.0.0-SNAPSHOT')

    implementation 'org.mifos:paymenthub-ee-core:2.0.0-SNAPSHOT'
    implementation 'org.apache.camel.springboot:camel-spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework:spring-web'
    implementation 'org.apache.camel:camel-endpointdsl'
    implementation 'org.apache.camel:camel-jetty'
    implementation 'org.apache.camel:camel-undertow'
    implementation 'org.apache.camel:camel-http'
    implementation 'org.apache.camel.springboot:camel-jackson-starter'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.json:json'
    implementation 'io.camunda:zeebe-client-java'
    implementation 'com.auth0:java-jwt'
    implementation 'org.apache.camel:camel-test-junit5'
    implementation 'org.apache.camel:camel-test-spring-junit5'
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.245'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'io.cucumber:cucumber-java:7.8.1'
    implementation 'io.cucumber:cucumber-spring:7.8.1'

    testImplementation 'io.cucumber:cucumber-junit:7.8.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "com.google.truth:truth:1.1.3"
    testImplementation 'com.google.code.gson:gson'
    testImplementation('io.rest-assured:rest-assured:5.1.1') {
        exclude group: 'org.codehaus.groovy'
    }
}

group = 'org.mifos'
version = '2.0.0.mifos-SNAPSHOT'
description = 'paymenthub-ee-connector-slcb'
java.sourceCompatibility = JavaVersion.VERSION_21
java.targetCompatibility = JavaVersion.VERSION_21

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Fixed jar name so the Dockerfile can copy the boot jar by name. `gradlew build`
// also produces a -plain.jar, which has no main class.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}


configurations {
    cucumberRuntime {
        extendsFrom testImplementation
    }
}

task cucumberCli() {
    dependsOn assemble, testClasses
    doLast {
        javaexec {
            mainClass = "io.cucumber.core.cli.Main"
            classpath = configurations.cucumberRuntime + sourceSets.main.output + sourceSets.test.output
            args = [
                    '--plugin', 'pretty',
                    '--plugin', 'html:target/cucumber-report.html',
                    '--glue', 'org.mifos.connector.slcb.cucumber',
                    'src/test/java/resources']
        }
    }
}
